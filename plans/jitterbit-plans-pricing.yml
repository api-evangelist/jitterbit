provenance_note: >-
  Replaces the 2026-05-04 bulk-sweep scaffold (method generated), whose Free /
  Professional / Enterprise tiers, 1,000-request quotas and 10 rpm limits were
  invented defaults. Jitterbit publishes no free tier and no prices.
plan_count: 7
pricing_model: quote-only
currency: null
billing_period: annual
pricing_note: >-
  Jitterbit publishes tier NAMES and a feature matrix, but no prices. The
  pricing page states: "All products require an annual contract. We offer custom
  pricing based on your requirements and also offer Enterprise License
  Agreements (ELA) to support enterprise-wide deployments. Please contact us to
  discuss your needs." Discounts are offered for nonprofits and educational
  institutions on request. There is no free tier, no self-serve signup and no
  published per-request or per-seat rate anywhere on jitterbit.com.
  API call volume is sold as an "API Calls/Month" line whose value is
  contractual per organization (see rate-limits/jitterbit-rate-limits.yml).
