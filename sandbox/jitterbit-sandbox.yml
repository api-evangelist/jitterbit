platform_test_surfaces:
  - name: Sandbox Cloud Agent Group (SCAG)
    description: >-
      A Jitterbit-hosted agent group updated to the latest agent at each Harmony
      release, ahead of the Production Cloud Agent Group. It is where a customer
      exercises new agent versions before production, not a public sandbox.
    docs: https://docs.jitterbit.com/release-notes/harmony-release-notes/sandbox-cloud-agent-group-releases/
  - name: Harmony environments
    description: >-
      Environments are the customer's own dev/test/prod separation inside their
      organization (2 environments on the iPaaS Standard tier, 99 on
      Professional and Enterprise). Projects are promoted between them with the
      Migrate Project API.
    docs: https://docs.jitterbit.com/management-console/environments/
  - name: Test Connection
    description: App Builder and connector configuration screens expose a Test Connection action for verifying endpoint configuration.
    docs: https://docs.jitterbit.com/app-builder/new-features/test-connections/
