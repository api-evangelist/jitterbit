summary: >-
  Jitterbit publishes an interactive API console but no public sandbox: there is
  no test-mode credential, no test data set, no free trial and no self-serve
  signup. Everything below requires a real Harmony account on a paid annual
  contract.
console:
  type: swagger-ui
  url: https://developer.jitterbit.com/harmony-platform-apis/
  spec_url: https://developer.jitterbit.com/harmony-platform-apis/test.json
  interactive: true
  description: >-
    The Harmony API reference is a Swagger UI 3 instance embedded in the
    developer portal, with Try it out enabled on every operation. The documented
    flow is: pick your region under Region, expand POST /login (Authenticate),
    Try it out, enter your Harmony credentials, Execute, copy authenticationToken
    from the response, click Authorize, paste it as the authToken header value.
    The docs warn that a CORS or network error in this console is usually a
    browser extension blocking the request, and suggest an incognito tab.
  credentials_required: true
  credentials_note: Live Harmony account credentials. No demo or test account is offered.
environment_selector:
  parameter: endpoint (an OpenAPI server variable)
  values: [dev, qa, api]
  default: dev
  published_guidance: >-
    "In Variables, internal testers can change the region's endpoint to use.
    This variable is for internal usage only and most users should not change
    this value from the default dev selection."
  finding: >-
    The published contract's three servers all default their endpoint variable
    to `dev`. A client generated straight from this spec targets a development
    endpoint unless the caller overrides the variable, and the documentation
    tells external users NOT to change it. This is consistent with the portal's
    own framing: "Harmony Platform APIs (preview)... currently targeted toward
    internal users."
