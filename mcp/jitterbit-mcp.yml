findings:
  - >-
    Jitterbit ships NO MCP server for its own Harmony platform APIs. Searched
    the product site, the documentation (a 32MB full-text search index at
    docs.jitterbit.com/search/search_index.json), npm and the public GitHub
    organization. Nothing exposes Jitterbit's own API as MCP tools.
  - >-
    "Jitterbit MCP" (https://www.jitterbit.com/product/mcp/) is a PRODUCT that
    lets Jitterbit customers create, expose and govern THEIR OWN MCP servers
    from their existing APIs and integrations. Jitterbit's CTO is quoted on that
    page saying "We are building Jitterbit MCP". It is not a Jitterbit-hosted
    MCP endpoint an agent can call to drive Harmony.
  - >-
    The MCP Client connector
    (https://docs.jitterbit.com/integration-studio/design/connectors/mcp-client/)
    is explicitly a CLIENT. Its own documentation states: "This connector is an
    MCP client, used to connect to an external MCP server to use its tools and
    capabilities." Its activities are List Tools, Invoke Tools and Get Prompt
    (Beta) — Jitterbit consuming other people's MCP servers.
  - >-
    Because no MCP server exists, no `MCPServer` pointer is emitted in apis.yml
    and no tool crosswalk (mcp/jitterbit-tool-crosswalk.yml) is written. The
    tools below are a DERIVED candidate list showing what a Harmony MCP server
    would expose if one were built from the published contract.
