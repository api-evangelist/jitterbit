  current: '12.9'
  docs: https://docs.jitterbit.com/release-notes/release-schedule/
  note: >-
    The Harmony platform APIs themselves carry no version segment in the URL
    path. The published OpenAPI declares info.version 1.0.0 and an optional
    AcceptVersion header on two operations (getProject, projectVariablesSet).
    Versioning in practice is the platform release train (12.x), released
    approximately every three weeks and staggered APAC → EMEA → NA.
