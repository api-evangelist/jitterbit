  name: Jitterbit Connector SDK REST API
  description: >-
    APIs for registering and managing connectors created with the Jitterbit Connector SDK — log in to
    Harmony, register a custom connector, list registered connectors, delete a connector registration,
    delete a connector payload, and validate a connector key and secret. Served from the Jitterbit Cloud
    RESTful Service on the region host. Documented in prose; no OpenAPI is published.
