- aid: jitterbit:api-manager-log-service-api
  name: Jitterbit API Manager Log Service API (Beta)
  description: >-
    An asynchronous REST API for retrieving API Manager log files as CSV or JSON, as an alternative to
    the Download as CSV button on the API Logs page. A request submits a time range, an organization ID
    and an optional query-string filter and returns a reference key; a second call polls that key and
    downloads the file when the status reaches COMPLETE. Requires an authentication token from the User
    Service Controller API and a user with Admin permission. Documented in prose; no OpenAPI is published.
  humanURL: >-
    https://docs.jitterbit.com/api-manager/api-manager-reference/api-manager-log-service-api/
  baseURL: https://na-east.jitterbit.com/jitterbit-cloud-restful-service/api/analytics/
  tags:
  - Logging
  - Analytics
  - API Management
  properties:
