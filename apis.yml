aid: jitterbit
name: Jitterbit
description: >-
  Jitterbit is an enterprise integration platform as a service (iPaaS) vendor.
  Its Harmony platform spans application and data integration (Integration
  Studio and the legacy Design Studio), full API management (API Manager with a
  Jitterbit-hosted cloud API gateway and an installable private gateway), EDI
  with AS2 and X12/EDIFACT trading-partner management, low-code application
  development (App Builder, formerly Vinyl), a multi-tenant Message Queue
  service, a connector marketplace, and an AI layer of agents, assistants and a
  Model Context Protocol offering. Jitterbit publishes one machine-readable
  contract of its own — the Harmony platform APIs, an OpenAPI 3.0.3 document
  covering Integration Studio projects, project variables, operation logs and
  schedules — alongside a prose-documented Connector SDK REST API and an
  asynchronous API log service. The developer surface includes a Java Connector
  SDK with Javadocs, a Connector Builder, downloadable recipes and process
  templates, and the jbcli command line tool.
type: Index
accessModel:
  pricing: paid
  onboarding: sales
  trial: false
  try_now: true
  public: false
  label: Contact Sales
  confidence: high
  source:
    - https://www.jitterbit.com/harmony/pricing/
  generated: '2026-08-27'
  method: searched
  note: >-
    Corrected from the 2026-07-22 derived value of freemium. Jitterbit publishes
    no free tier and no free trial (/free-trial/ returns 404); all products
    require an annual contract and pricing is quote-only. try_now is true only
    in the sense that the developer portal embeds a Swagger UI console — it
    still requires live Harmony credentials.
