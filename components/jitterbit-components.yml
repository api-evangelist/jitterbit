generated: '2026-08-27'
method: searched
source: https://docs.jitterbit.com/developer-portal/connector-sdk/ui-components/
scope: >-
  Jitterbit publishes one documented client-side component library: the
  Connector SDK UI components, declared by a connector developer in the
  connector's adapter JSON and rendered by Jitterbit Studio in the connection
  and activity configuration screens. These are components Jitterbit ships and
  a developer composes — not an embeddable widget library for a third-party
  website. Jitterbit publishes no embeddable JS SDK, no web-component bundle
  and no CDN-hosted element library.
