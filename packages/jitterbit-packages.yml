note: >-
  Jitterbit publishes no first-party client library for the Harmony platform
  APIs in any public package registry. Registry searches for `jitterbit` on
  Maven Central (numFound 0 for g:com.jitterbit and 0 for the free-text query),
  PyPI (404 for `jitterbit` and `jitterbit-sdk`) and NuGet returned nothing
  first-party. What Jitterbit does publish on npm is one first-party CLI
  (`jbcli`, last released 2018-10-31) and three forks of third-party libraries
  under its own `@jitterbit` scope. The Connector SDK — the one genuinely
  first-party SDK — is a Java kit distributed from the Harmony portal and
  documented on docs.jitterbit.com; it has no registry coordinates, so no
  version metadata endpoint exists to query.
