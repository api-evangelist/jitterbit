        - authToken: []
      summary: Update Schedule
      description: >-
        ## **Update a Schedule**

        The _Update Schedule API_ updates an existing [operation schedule](https://docs.jitterbit.com/integration-studio/design/operations/settings/schedules/). For new operation schedules, use the _Create Schedule API_.

        | **Parameter** | **Required** | **Data Type** | **Description** | **Default** |

        | --- | --- | --- | --- | --- |

        | environmentId | Yes | Integer | The [Harmony environment ID](https://docs.jitterbit.com/management-console/environments/#viewing-environments) associated with the operation schedule to update. This ID is located by hovering on the environment name in the Management Console [Environments](https://docs.jitterbit.com/management-console/environments/) page. |  |

        | projectGuid | Yes | String | The GUID of the project associated with the operation schedules to update. Project GUIDs can be retrieved using the _Get Project API_. Project GUIDs are also visible in your browser's address bar when you are accessing them in Integration Studio. For example, `9a87b6c5-a1b2-34c5-6d7e-123456a7b89c`. |  |

        | scheduleName | Yes | String | The name of the operation schedule. |  |

        | schedulerId | Yes | Integer | The ID of the operation schedule to update. |  |

        | schedulerGuid | Yes | String | The GUID of the operation schedule to update. |  |

        | occurrence |  | Object | The object representing the settings related to which days to run the operation schedule. |  |

        | occurs |  | Integer |  |  |

        | daily |  | Integer |  |  |

        | monday |  | Integer |  |  |

        | tuesday |  | Integer |  |  |

        | wednesday |  | Integer |  |  |

        | thursday |  | Integer |  |  |

        | friday |  | Integer |  |  |

        | saturday |  | Integer |  |  |

        | sunday |  | Integer |  |  |

        | weekly |  | Integer |  |  |

        | monthly |  | Integer |  |  |

        | monthlyADay |  | Integer |  |  |

        | monthlyAOfEveryXMonth |  | Integer |  |  |

        | monthlyBDay |  | Integer |  |  |

        | monthlyBNum |  | Integer |  |  |

        | monthlyBOfEveryXMonth |  | Integer |  |  |

        | frequency |  | Object | The object representing the settings related to how often to run the operation schedule. |  |

        | frequency |  | Integer |  |  |

        | frequencyOnceTime |  | Time | The specific time of day the operation schedule should run one time. |  |

        | frequencyEveryHm |  | Integer |  |  |

        | frequencyEveryNum |  | Integer |  |  |

        | frequencyStartTime |  | Time |  |  |

        | frequencyEndTime |  | Time |  |  |

        | duration |  | Object | The object representing the settings related to how long to run the operation schedule. |  |

        | durationYesnoEnd |  | Integer |  |  |

        | durationStartDate |  | Date | The date to start running the operation schedule. |  |

        | durationEndDate |  | Date | The date to end running the operation schedule. |  |

      operationId: updateSchedule
      requestBody:
        content:
          text/plain:
            schema:
              type: string
              example: "{\r\n    \"environmentId\": {{environment-id}},\r\n    \"projectGuid\": \"{{update-schedule-project-guid}}\",\r\n    \"scheduleName\": \"Fixed Schedule TestUpdater-{{$timestamp}}\",\r\n    \"schedulerId\": {{update-schedule-id}},\r\n    \"schedulerGuid\": \"{{update-schedule-guid}}\",\r\n    \"occurrence\": {\r\n        \"occurs\": \"1\",\r\n        \"daily\": 69,\r\n        \"monday\": \"-1\",\r\n        \"tuesday\": \"-1\",\r\n        \"wednesday\": \"-1\",\r\n        \"thursday\": \"-1\",\r\n        \"friday\": \"-1\",\r\n        \"saturday\": \"-1\",\r\n        \"sunday\": \"-1\",\r\n        \"weekly\": \"1\",\r\n        \"monthly\": \"1\",\r\n        \"monthlyADay\": \"1\",\r\n        \"monthlyAOfEveryXMonth\": \"1\",\r\n        \"monthlyBDay\": \"-1\",\r\n        \"monthlyBNum\": \"1\",\r\n        \"monthlyBOfEveryXMonth\": \"1\"\r\n    },\r\n    \"frequency\": {\r\n        \"frequency\": \"1\",\r\n        \"frequencyOnceTime\": \"03:13:00\",\r\n        \"frequencyEveryHm\": \"1\",\r\n        \"frequencyEveryNum\": \"0\",\r\n        \"frequencyStartTime\": \"\",\r\n        \"frequencyEndTime\": \"\"\r\n    },\r\n    \"duration\": {\r\n        \"durationYesnoEnd\": \"0\",\r\n        \"durationStartDate\": \"2023-7-7\",\r\n        \"durationEndDate\": \"\"\r\n    }\r\n}"
      responses:
        '200':
          description: ''
    post:
      tags:
        - Schedules
      security:
        - authToken: []
      summary: Create Schedule
      description: >-
        ## **Create Schedule**

        The _Create Schedule API_ creates an [operation schedule](https://docs.jitterbit.com/integration-studio/design/operations/settings/schedules/) and assigns it to the specified [Integration Studio project](https://docs.jitterbit.com/integration-studio/design/projects/creation-and-configuration/). For existing schedules, use the _Update Schedule API_.

        | **Parameter** | **Required** | **Data Type** | **Description** | **Default** |

        | --- | --- | --- | --- | --- |

        | environmentId | Yes | Integer | The [Harmony environment ID](https://docs.jitterbit.com/management-console/environments/#viewing-environments) to create the operation schedule in. This ID is located by hovering on the environment name in the Management Console [Environments](https://docs.jitterbit.com/management-console/environments/) page. |  |

        | projectGuid | Yes | String | The GUID of the project to assign the operation schedule to. Project GUIDs can be retrieved using the _Get Project API_. Project GUIDs are also visible in your browser's address bar when you are accessing them in Integration Studio. For example, `9a87b6c5-a1b2-34c5-6d7e-123456a7b89c`. |  |

        | scheduleName | Yes | String | The name of the operation schedule. |  |

        | occurrence |  | Object | The object representing the settings related to which days to run the operation schedule. |  |

        | occurs |  | Integer |  |  |

        | daily |  | Integer |  |  |

        | monday |  | Integer |  |  |

        | tuesday |  | Integer |  |  |

        | wednesday |  | Integer |  |  |

        | thursday |  | Integer |  |  |

        | friday |  | Integer |  |  |

        | saturday |  | Integer |  |  |

        | sunday |  | Integer |  |  |

        | weekly |  | Integer |  |  |

        | monthly |  | Integer |  |  |

        | monthlyADay |  | Integer |  |  |

        | monthlyAOfEveryXMonth |  | Integer |  |  |

        | monthlyBDay |  | Integer |  |  |

        | monthlyBNum |  | Integer |  |  |

        | monthlyBOfEveryXMonth |  | Integer |  |  |

        | frequency |  | Object | The object representing the settings related to how often to run the operation schedule. |  |

        | frequency |  | Integer |  |  |

        | frequencyOnceTime |  | Time | The specific time of day the operation schedule should run one time. |  |

        | frequencyEveryHm |  | Integer |  |  |

        | frequencyEveryNum |  | Integer |  |  |

        | frequencyStartTime |  | Time |  |  |

        | frequencyEndTime |  | Time |  |  |

        | duration |  | Object | The object representing the settings related to how long to run the operation schedule. |  |

        | durationYesnoEnd |  | Integer |  |  |

        | durationStartDate |  | Date | The date to start running the operation schedule. |  |

        | durationEndDate |  | Date | The date to end running the operation schedule. |  |

      operationId: createSchedule
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                duration:
                  type: object
                  properties:
                    durationEndDate:
                      type: string
                      example: ''
                    durationStartDate:
                      type: string
                      example: 2023-5-3
                    durationYesnoEnd:
                      type: number
                      example: 0
                environmentId:
                  type: string
                  example: ''
                frequency:
                  type: object
                  properties:
                    frequency:
                      type: number
                      example: 1
                    frequencyEndTime:
                      type: string
                      example: ''
                    frequencyEveryHm:
                      type: number
                      example: 1
                    frequencyEveryNum:
                      type: number
                      example: 0
                    frequencyOnceTime:
                      type: string
                      example: '00:00:00'
                    frequencyStartTime:
                      type: string
                      example: ''
                occurrence:
                  type: object
                  properties:
                    daily:
                      type: number
                      example: 1
                    friday:
                      type: number
                      example: -1
                    monday:
                      type: number
                      example: -1
                    monthly:
                      type: number
                      example: 1
                    monthlyADay:
                      type: number
                      example: 1
                    monthlyAOfEveryXMonth:
                      type: number
                      example: 1
                    monthlyBDay:
                      type: number
                      example: -1
                    monthlyBNum:
                      type: number
                      example: 1
                    monthlyBOfEveryXMonth:
                      type: number
                      example: 1
                    occurs:
                      type: number
                      example: 1
                    saturday:
                      type: number
                      example: -1
                    sunday:
                      type: number
                      example: -1
                    thursday:
                      type: number
                      example: -1
                    tuesday:
                      type: number
                      example: -1
                    wednesday:
                      type: number
                      example: -1
                    weekly:
                      type: number
                      example: 1
                projectGuid:
                  type: string
                  example: ''
                scheduleName:
                  type: string
                  example: Schedule_Test_Automated-{{$timestamp}}
            example:
              duration:
                durationEndDate: ''
                durationStartDate: 2023-5-3
                durationYesnoEnd: 0
              environmentId: '{{environment-id}}'
              frequency:
                frequency: 1
                frequencyEndTime: ''
                frequencyEveryHm: 1
                frequencyEveryNum: 0
                frequencyOnceTime: '00:00:00'
                frequencyStartTime: ''
              occurrence:
                daily: 1
                friday: -1
                monday: -1
                monthly: 1
                monthlyADay: 1
                monthlyAOfEveryXMonth: 1
                monthlyBDay: -1
                monthlyBNum: 1
                monthlyBOfEveryXMonth: 1
                occurs: 1
                saturday: -1
