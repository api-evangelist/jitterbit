    post:
      tags:
        - Projects
      security:
        - authToken: []
      summary: Import Project
      description: >-
        ## **Import Project**

        The _Import Project API_ [imports](https://docs.jitterbit.com/integration-studio/design/projects/exports-and-imports/#projectexportsandimports-import) an [Integration Studio project](https://docs.jitterbit.com/integration-studio/design/projects/creation-and-configuration/) into a specific environment. The imported project must be a JSON file that was generated by [exporting](https://docs.jitterbit.com/integration-studio/design/projects/exports-and-imports/#projectexportsandimports-export) the project.

        | **Parameter** | **Required** | **Data Type** | **Description** | **Default** |

        | --- | --- | --- | --- | --- |

        | document | Yes | File | The project file containing import data in JSON format. |  |

        | organizationId | Yes | Integer | The [Harmony organization ID](https://docs.jitterbit.com/getting-started/jitterbit-support/my-harmony-organization-id/) to import the project to. This ID is located in the top right of the Harmony portal header next to the organization name. This is a header parameter. |  |

        | targetEnvironmentId | Yes | Integer | The [Harmony environment ID](https://docs.jitterbit.com/management-console/environments/#viewing-environments) to import the project to. This ID is located by hovering on the environment name in the Management Console [Environments](https://docs.jitterbit.com/management-console/environments/) page.  |  |

        | name | No | String | The name the project will have after the import. |  |

        | includeEmails | No | Boolean | Include project [email notifiations](https://docs.jitterbit.com/integration-studio/design/notifications/email-notifications/) from the imported project. | `true` |

        | includeSchedules | No | Boolean | Include [operation schedules](https://docs.jitterbit.com/integration-studio/design/operations/settings/schedules/) from the imported project. | `true` |

      operationId: importProject
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                document:
                  description: The project file containing import data in JSON format.
                  type: string
                  format: binary
                organizationId:
                  in: header
                  required: true
                  schema:
                    type: string
                    example: ''
                  description: The [Harmony organization ID](https://docs.jitterbit.com/getting-started/jitterbit-support/my-harmony-organization-id/) associated with the operation logs to return. This ID is located in the top right of the Harmony portal header next to the organization name. This is a header parameter.
                targetEnvironmentId:
                  description: The [Harmony environment ID](https://docs.jitterbit.com/management-console/environments/#viewing-environments) to import the project to. This ID is located by hovering on the environment name in the Management Console [Environments](https://docs.jitterbit.com/management-console/environments/) page
                  type: string
                  example: ''
                name:
                  description: The name the project will have after the import.
                  type: string
                  example: ''
                includeEmails:
                  description: Include project [email notifiations](https://docs.jitterbit.com/integration-studio/design/notifications/email-notifications/) from the imported project. Default is `true`.
                  type: boolean
                  example: true
                includeSchedules:
                  description: Include [operation schedules](https://docs.jitterbit.com/integration-studio/design/operations/settings/schedules/) from the imported project. Default is `true`.
                  type: boolean
                  example: true
      responses:
        '200':
          description: ''
  /migration:
    put:
      tags:
        - Projects
      security:
        - authToken: []
      summary: Update Migrated Project
      description: >-
        ## **Update Migrated Project**

        The _Update Migrated Project API_ replaces an already [migrated](https://docs.jitterbit.com/integration-studio/design/projects/migration/) [Integration Studio project](https://docs.jitterbit.com/integration-studio/design/projects/creation-and-configuration/) from one environment to a different environment. If this is the first time migrating a project into the target environment and you do not have a `targetProjectGuid`, you must migrate the project first, either in the UI or by using the _Migrate Project API_.

        | **Parameter** | **Required** | **Data Type** | **Description** | **Default** |

        | --- | --- | --- | --- | --- |

        | sourceProjectGuid | Yes | String | The GUID of the project to migrate. Project GUIDs can be retrieved using the _Get Project API_. Project GUIDs are also visible in your browser's address bar when you are accessing them in Integration Studio. For example, `9a87b6c5-a1b2-34c5-6d7e-123456a7b89c`. |  |

        | targetProjectGuid | Yes | String | The GUID of the project to replace. Project GUIDs can be retrieved using the _Get Project API_. Project GUIDs are also visible in your browser's address bar when you are accessing them in Integration Studio. For example, `9a87b6c5-a1b2-34c5-6d7e-123456a7b89c`. |  |

        | targetEnvironmentId | Yes | Integer | The [Harmony environment ID](https://docs.jitterbit.com/management-console/environments/#viewing-environments) to migrate the project to. This ID is located by hovering on the environment name in the Management Console [Environments](https://docs.jitterbit.com/management-console/environments/) page. |  |

        | projectHistoryTagName | No | String | A tag with a description of the migration. |  |

      operationId: migrateProjectUpdate
      requestBody:
        content:
          text/plain:
            schema:
              type: string
              example: "{\r\n    \"sourceProjectGuid\": \"{{migrate-project-source-project-guid}}\",\r\n    \"targetProjectGuid\": \"{{migrate-project-target-project-guid}}\",\r\n    \"components\": [\r\n        //\"2e146670-50fc-4e31-acac-9f62871a87ac\"\r\n    ],\r\n    \"targetEnvironmentId\": \"{{migrate-project-target-environment-id}}\",\r\n    \"projectHistoryTagName\": \"{{migrate-project-history-tag-name}}\"\r\n}"
      responses:
        '200':
          description: ''
    post:
      tags:
        - Projects
      security:
        - authToken: []
      summary: Migrate Project
      description: >-
        ## **Migrate Project**

        The _Migrate Project API_ [migrates](https://docs.jitterbit.com/integration-studio/design/projects/migration/) an [Integration Studio project](https://docs.jitterbit.com/integration-studio/design/projects/creation-and-configuration/) from one environment into a different environment. If the project has already been migrated, then you must use the _Update Migrated Project API_.

        | **Parameter** | **Required** | **Data Type** | **Description** | **Default** |

        | --- | --- | --- | --- | --- |

        | sourceProjectGuid | Yes | String | The GUID of the project to migrate. Project GUIDs can be retrieved using the _Get Project API_. Project GUIDs are also visible in your browser's address bar when you are accessing them in Integration Studio. For example, `9a87b6c5-a1b2-34c5-6d7e-123456a7b89c`. |  |

        | targetEnvironmentId | Yes | Integer | The [Harmony environment ID](https://docs.jitterbit.com/management-console/environments/#viewing-environments) to migrate the project to. This ID is located by hovering on the environment name in the Management Console [Environments](https://docs.jitterbit.com/management-console/environments/) page. |  |

        | projectHistoryTagName | No | String | A tag with a description of the migration. |  |

      operationId: migrateProject
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                projectHistoryTagName:
                  type: string
                  example: ''
                sourceProjectGuid:
                  type: string
                  example: ''
                targetEnvironmentId:
                  type: string
                  example: ''
            example:
              projectHistoryTagName: '{{migrate-project-history-tag-name}}'
              sourceProjectGuid: '{{migrate-project-source-project-guid}}'
              targetEnvironmentId: '{{migrate-project-target-environment-id}}'
      responses:
        '200':
          description: ''
